<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Sambagasse Photo</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<h1>Sambagasse 📸!!!</h1>

<!-- CAMERA -->
<button id="cameraButton">📸 Take a picture</button>

<input 
    type="file" 
    id="cameraInput" 
    accept="image/*" 
    capture="environment"
    style="display:none"
/>

<!-- PREVIEW -->
<div id="previewContainer">
    <img id="preview">
</div>

<!-- CONTROLS -->
<div class="controls">

    <!-- BACKGROUNDS -->
    <div class="control-group">
        <h3>Background</h3>

        <button class="bg-btn" data-bg="white" onclick="setBackground('white')">⚪</button>
        <button class="bg-btn" data-bg="yellow" onclick="setBackground('yellow')">🟡</button>
        <button class="bg-btn" data-bg="red" onclick="setBackground('red')">🔴</button>
        <button class="bg-btn" data-bg="blue" onclick="setBackground('blue')">🔵</button>
    </div>

    <!-- FILTERS -->
    <div class="control-group" id="filterBar">
        <h3>Effects</h3>

        <button class="filter" data-effect="none">🧼 Clean</button>
        <button class="filter" data-effect="invert">Invert</button>
        <button class="filter" data-effect="zoom">Zoom</button>
        <button class="filter" data-effect="dots">Dots</button>

        <!-- keep for later if needed -->
        <!--
        <button class="filter" data-effect="poster">Posterize</button>
        <button class="filter" data-effect="sobel">Edges</button>
        <button class="filter" data-effect="sepia">Sepia</button>
        <button class="filter" data-effect="ink">Ink</button>
        -->
    </div>

</div>

<!-- SEND -->
<button id="sendButton">🔥 Send to the wall!</button>

<!-- CONSENT MODAL -->
<div id="consentModal" class="modal hidden">
  <div class="modal-content">
    <p>
      By clicking "Yes", you agree that your photo may be stored and used 
      for promotional purposes.
    </p>

    <div class="modal-buttons">
      <button onclick="handleConsent(true)">✅ Yes</button>
      <button onclick="handleConsent(false)">❌ No</button>
    </div>

    <hr>
    <button onclick="downloadImage()">⬇️ Download your photo</button>
  </div>
</div>

<!-- SCRIPTS -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="https://cdn.jsdelivr.net/npm/glfx/dist/glfx.js"></script>
<script src="script.js"></script>

</body>
</html>
