<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Sambagasse ZW</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<link rel="stylesheet" href="style.css">
</head>

<body>

<h1>Welcome to Sambagasse at ZW!</h1>

<button id="cameraButton">📸 Take a picture</button>

<input
type="file"
id="cameraInput"
accept="image/*"
capture="environment"
style="display:none"
>

<div id="previewContainer" style="display:none">

<canvas id="canvas"></canvas>

<div id="effects">

<button onclick="applyEffect('none')">Original</button>
<button onclick="applyEffect('edges')">Edges</button>
<button onclick="applyEffect('cool')">Cool</button>
<button onclick="applyEffect('warm')">Warm</button>

</div>

<button id="sendButton">Send</button>

</div>

<script src="script.js"></script>

</body>
</html>
